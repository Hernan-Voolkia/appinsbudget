<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="/img/favicon.ico">
    <!-- Tipografía corporativa extraída de tu UI -->
    <link href='https://fonts.cdnfonts.com/css/helvetica-neue-9' rel='stylesheet' type='text/css'>
    
    <title>Ingreso al Sistema Corporativo</title>
    
    <style>
        /* Variables Corporativas */
        :root {
            --color-primario: #005993; /* Azul corporativo exacto */
            --color-primario-hover: #004470;
            --color-texto: #333333;
            --color-fondo: #ffffff;
            --fuente-corp: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--color-fondo); 
            font-family: var(--fuente-corp);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        
        .login-box {
            text-align: center;
            padding: 40px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 350px;
            background-color: #fafafa;
        }

        .logo-empresa {
            margin-bottom: 30px; /* Aumenté un poco el margen al quitar el título */
        }

        /* Contenedor del formulario */
        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Estilo para el input de texto */
        input[type="text"] {
            width: 100%;
            text-align: center;
            font-size: 1.1em;
            padding: 12px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: var(--fuente-corp);
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--color-primario);
            outline: none;
            box-shadow: 0 0 5px rgba(0, 89, 147, 0.3);
        }

        /* Estilo del botón */
        button {
            background-color: var(--color-primario); 
            color: #ffffff;
            padding: 14px;
            font-size: 1em;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-family: var(--fuente-corp);
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: var(--color-primario-hover);
        }
        
        button:disabled {
            background-color: #999999;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <!-- Logo de la empresa -->
        <img src="/img/Pos_color_RGB.jpg" alt="Logo Empresa" width="128" height="128" class="logo-empresa">
        {% if error %}
           <div style="background-color: #f8d7da; color: #721c24; padding: 10px; border-radius: 4px; margin-bottom: 15px; font-size: 0.9em; text-align: center;">
            ⚠️ {{ error }}
           </div>
        {% endif %}
        <form id="loginForm" action="/validar-login" method="post">
            <input type="text" id="username" name="username" required autocomplete="off" placeholder="Usuario (Ej: jperez)" autofocus>
            <button type="submit" id="submitBtn">Ingresar</button>
        </form>
    </div>

    <!-- Script de UX para prevención de doble envío -->
    <script>
        document.getElementById('loginForm').addEventListener('submit', function() {
            var btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = 'Validando en LDAP...';
        });
    </script>

</body>
</html>
